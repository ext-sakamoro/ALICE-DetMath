# ALICE-Law conformance manifest for this crate (alice-det-math). One entry
# per gate defined in ALICE-Law's conformance/gates.toml. Schema (status /
# evidence / since / note / reference_repo) is docs/CONFORMANCE.md's
# "Manifest" section in that repository; a `pass` or `n/a` entry also names
# the red mutant (for `n/a`, the change that would add a relevant site and
# make the gate apply, so the absence is demonstrated rather than assumed).
#
# Entries here are written from what this repository's own commits, CI
# workflows and test suites actually show at origin/main, checked directly
# rather than assumed: a gate without concrete evidence is `unverified`, not
# guessed `pass`. alice-det-math is the root arithmetic crate of the chain:
# it defines the deterministic f32/f64 transcendentals every other crate
# calls, so it is the one crate G1 names as the place those methods may live,
# and it is the bottom of the identifier fold (no upstream Law crate sits
# below it). It is `no_std` with no `alloc`, a pure-computation library that
# persists nothing and receives no Law-bearing value across a boundary.

