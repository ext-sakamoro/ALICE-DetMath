[features.std]
guarantee = "inside"
evidence = ["src/ops.rs", "tests/golden.rs", ".github/workflows/ci.yml test job (Test (no_std, software sqrt) step)"]
note = "std enables the hardware sqrt instruction for ops::sqrt / sqrt64 (IEEE 754 requires sqrt correctly rounded, so the hardware result is bit-identical to the correctly rounded software fallback used without std); lib.rs states nothing else in the crate needs std. SEMANTICS_ID does not change with the feature (sqrt is pinned in tests/golden.rs and reproduces both ways), and CI runs the whole golden suite under cargo test --no-default-features --features simd, asserting the SAME hashes as the std build (the 'Test (no_std, software sqrt)' step) -- so the feature adds no float path and produces identical bits with and without it. Conditions 1-3 met."

[features.simd]
guarantee = "inside"
evidence = ["src/simd.rs", "tests/simd_parity.rs", "tests/golden.rs", ".github/workflows/ci.yml simd-paths job"]
note = "simd enables the wide::f32x8 kernels. They are lane-for-lane bit-identical to the scalar f32 functions, proven by tests/simd_parity.rs over dense sweeps and the special values (+/-0, +/-inf, NaN, subnormals, the exp overflow/underflow edges, |x| >= 2^31) and pinned by tests/golden.rs::simd_outputs_match_recorded_hashes; the SIMD kernels carry no SEMANTICS_ID pin of their own on purpose (an identifier that changed with the feature set would not identify the arithmetic), and tests/golden.rs::every_simd_function_has_a_parity_test keeps every kernel covered by a parity test. The simd-paths CI legs run the suite with the f32x8 ops lowered through sse2-only, avx2+fma and target-cpu=native, all reproducing the scalar bits. Conditions 1-3 met: no new arithmetic, same bits, covered by parity and the target matrix."
