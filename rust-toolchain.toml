# Rust toolchain pin (clippy の lint 集合は版ごとに変わるので固定する)
# `targets`: the bare-metal target the CI `no_std` job builds the rlib for; listed
# here (not in the workflow) so rustup installs it for the pinned toolchain that
# cargo actually uses (dtolnay/rust-toolchain@stable would add it to stable only)
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["thumbv7em-none-eabihf", "wasm32-wasip1"]
profile = "minimal"
