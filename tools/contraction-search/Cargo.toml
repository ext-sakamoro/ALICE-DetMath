[workspace]
# own workspace: not a member of the library's workspace, so the fused steps written here
# are outside the library's G3 scan (they are the mutants this tool searches inputs for)

[package]
name = "contraction-search"
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"
description = "ALICE-Law G4: search inputs whose output changes when one polynomial step is fused into one rounding"

[[bin]]
name = "contraction-search"
path = "src/main.rs"

[dependencies]
alice-det-math = { path = "../.." }

[profile.release]
debug = false
