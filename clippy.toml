# Determinism gate (G10): no OS entropy and no wall clock in the crate's
# production code. Every function here is a pure function of its input bits
# on every platform; a path that reads the clock or draws OS randomness would
# make the result depend on when or how many times it ran.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "the wall clock makes results depend on timing; pass time in or use a step count" },
    { path = "std::time::Instant::elapsed", reason = "reads the wall clock the same as Instant::now; duration_since on an already-held value is fine, this reads the clock again" },
    { path = "std::time::SystemTime::elapsed", reason = "reads the wall clock the same as SystemTime::now; duration_since on an already-held value is fine, this reads the clock again" },
    { path = "std::time::SystemTime::now", reason = "the wall clock makes results depend on timing; pass time in or use a step count" },
    { path = "std::collections::hash_map::RandomState::new", reason = "seeds from OS randomness, which this crate's output must never depend on" },
]
disallowed-types = [
    # disallowed-methods cannot name RandomState::default (a trait method,
    # not reachable via the implementing type's path alone); naming the type
    # itself here catches ::default() too, along with any other explicit
    # naming (a type annotation, a turbofish), without touching HashMap::new's
    # own internal (unnamed) use of RandomState.
    { path = "std::collections::hash_map::RandomState", reason = "seeds from OS randomness, which this crate's output must never depend on; see disallowed-methods for RandomState::new" },
]
