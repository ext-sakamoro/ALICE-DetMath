name: CI

# Every step here is mirrored in scripts/preflight.sh (run before `git push`):
# a step that is not in preflight.sh is a step that can only fail remotely.
#
# The whole point of this crate is that the bits are the same everywhere, so
# the test matrix *is* the product: 5 native platforms + wasm32 + the SIMD
# fallback paths (no AVX / no FMA) + FMA forced on. `tests/golden.rs` pins
# SHA-256 hashes recorded on aarch64-apple-darwin; every lane must reproduce them.

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# on main each commit has a group of its own and a run there is never
# cancelled; a newer push cancels an older run only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # docs.rs feature set (Cargo.toml [package.metadata.docs.rs] all-features)
  ALL_FEATURES: std,simd

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # the debug and the release legs of the suite (about 5 minutes each on the slowest runner)
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # - macos-latest       → aarch64-apple-darwin       (golden hash baseline)
        # - macos-15-intel     → x86_64-apple-darwin
        # - ubuntu-latest      → x86_64-unknown-linux-gnu
        # - ubuntu-24.04-arm   → aarch64-unknown-linux-gnu
        # - windows-latest     → x86_64-pc-windows-msvc
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test
      - name: Test (docs.rs feature set)
        shell: bash
        run: cargo test --features "$ALL_FEATURES"
      # no_std: the software sqrt path must produce the same golden hashes
      - name: Test (no_std, software sqrt)
        run: cargo test --no-default-features --features simd
      # ALICE-Law G4 / G5: the whole suite under the release profile on every runner of the
      # matrix (aarch64: macos-latest, ubuntu-24.04-arm; x86_64: the other three), with the
      # named signed-zero and exact-cancellation tests required to run
      - name: Test (release, default features)
        shell: bash
        run: scripts/run_tests.sh signed_zero=4,exact_cancellation=2,golden,dense_golden=7,contraction_goldens=1 -- cargo test --release
      - name: Test (release, docs.rs feature set)
        shell: bash
        run: scripts/run_tests.sh signed_zero=4,exact_cancellation=2,simd_parity -- cargo test --release --features "$ALL_FEATURES"
      # G14: round-to-nearest-even and no flush-to-zero, asserted at run time in
      # both profiles; scripts/run_tests.sh fails when the binary passed no test
      # (a missing, ignored or cfg'd-out test is red, not an empty green run)
      - name: Test (float environment, debug and release)
        shell: bash
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment
      # ALICE-Law G13: no thread, parallel iterator or hash collection in src/ (the hash
      # collections are also banned by clippy.toml)
      - name: No unspecified order (scan of src/)
        shell: bash
        run: scripts/run_tests.sh no_unspecified_order=2 -- cargo test --test no_unspecified_order
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's, built with --locked): its own tests, then the check over src/ tests/
      # examples/ benches/ with the exact fma-call counts of
      # scripts/no-outer-fneg-of-fma-allowlist.toml (0 here); the IR half is g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        shell: bash
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .
      # ALICE-Law G4: every pin of tests/contraction_goldens.rs at a step that
      # tools/contraction-search models gives the pinned bits from the library and other
      # bits with that one step fused (so each pin separates the step it names); fails when
      # it checks no pin or a pin names a step it neither models nor lists as leading
      - name: Contraction pins separate their steps
        shell: bash
        run: |
          cargo fmt --manifest-path tools/contraction-search/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/contraction-search/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/contraction-search/Cargo.toml -- --check-pins tests/contraction_goldens.rs

  simd-paths:
    name: SIMD codegen paths (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # SSE2-only: exercises wide's f32x4 fallback for every f32x8 op
          - name: sse2-only
            rustflags: "-C target-feature=-avx2,-avx,-fma,-sse4.1"
          # AVX2 + FMA available: proves nothing gets contracted into an fma
          - name: avx2-fma
            rustflags: "-C target-feature=+avx2,+fma"
          - name: native
            rustflags: "-C target-cpu=native"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: simd-${{ matrix.name }}
      - name: Test (${{ matrix.name }})
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --features "$ALL_FEATURES"

  build-flags:
    # G14, dynamic half: the flags cargo really passes to rustc, read from `-v` in a
    # fresh target directory (a reused one prints Fresh without the command line),
    # for the default, all-features and no-default feature sets in the release
    # profile; fails on a native / fast-math / x87 flag, and when no command line for
    # this crate was seen. A job of its own, so the simd-paths RUSTFLAGS never reach it
    name: Effective rustc flags (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Effective rustc flags (default, all features, no default features)
        shell: bash
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --all-features
          python3 scripts/build_flags_check.py -- cargo check --release --lib --no-default-features

  wasm:
    name: Test (wasm32-wasip1 via wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # dtolnay/rust-toolchain's `targets:` has silently skipped the rustup
      # target add before; the explicit call is idempotent
      - name: Ensure wasm32-wasip1 rust-std is installed
        run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-wasip1
      # official setup action (retry built in); `curl | bash` is green on a
      # network error and fails one step later with exit 127
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Build tests (wasm32-wasip1)
        run: cargo test --features "$ALL_FEATURES" --target wasm32-wasip1 --no-run
      # every lib and test target runs under wasmtime: cargo runs the binary it just built through the
      # runner, the package root mapped at its own path (tests that read the repository's files find
      # them), and scripts/wasm_tests_check.py fails when a target cargo lists (cargo metadata) did not
      # run and pass, or a should_panic test was skipped without an entry in scripts/wasm_test_exclusions.toml
      - name: Every test target via wasmtime (lib + tests, checked against cargo metadata)
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime --dir=$PWD::$PWD"
          cargo test --features "$ALL_FEATURES" --target wasm32-wasip1 --lib --tests --no-fail-fast 2>&1 | tee wasm-tests.log
          python3 scripts/test_wasm_tests_check.py
          python3 scripts/wasm_tests_check.py wasm-tests.log

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # the release tags: scripts/id_move_check.py compares with the newest one
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (docs.rs feature set, all targets)
        run: cargo clippy --all-targets --features "$ALL_FEATURES" -- -D warnings
      - name: clippy (no_std lib)
        run: cargo clippy --lib --no-default-features -- -D warnings
      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      # the preflight mirror of law-readme-block.yml (the check itself runs there, here its tests)
      - name: README ALICE-Law block preflight check (tests)
        run: python3 scripts/test_law_readme_block_check.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py
      # G9: an identifier (SEMANTICS_ID) moves only with a breaking version, with the
      # released value in its previous list (when it has one) and both values named in
      # CHANGELOG.md; the released value is read from the published crate at the newest
      # release tag (scripts/id_move_check.py, shared with the other ALICE crates). A
      # registry that cannot be read fails on main and warns on ci/ branches and PRs
      - name: Identifier moves (tests)
        run: python3 scripts/test_id_move_check.py
      - name: Identifier moves (the release compared with)
        id: id-base
        run: echo "crate=$(python3 scripts/id_move_check.py --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/cache/*/${{ steps.id-base.outputs.crate }}.crate
          key: id-move-${{ steps.id-base.outputs.crate }}
      - name: Identifier moves (against the published release)
        run: python3 scripts/id_move_check.py
      # the version names the arithmetic: SEMANTICS_ID must be the identifier
      # scripts/semantics_versions.toml records for this version (tests/semantics_version.rs, in the test
      # jobs), and that table is append-only against the base (a row changed or removed fails), so the
      # identifier cannot move under an unchanged version (0.5.2 carried two across git revisions)
      - name: The base CI compares with (scripts/ci_base.py, shared; tests)
        run: python3 scripts/test_ci_base.py
      - name: Version names its identifier (append-only table, tests)
        run: python3 scripts/test_semantics_versions_check.py
      # on a push to main the base is main before the push (github.event.before; the checkout above has the
      # whole history), elsewhere the merge-base with origin/main; a base that cannot be named fails
      - name: Version names its identifier (append-only table, against the base)
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --quiet origin main
          python3 scripts/semantics_versions_check.py --ci --event "$EVENT" --ref "$REF" --before "$BEFORE"
      # G7 / G8: the public API is enumerated from rustdoc JSON; every item that takes or
      # returns bytes, text or a reader, every non-Rust ABI fn, serde / FromStr / Read impl
      # and outside re-export needs a decision in scripts/api_boundary.toml (shared with the
      # other ALICE crates); an undecided item, a stale entry or 0 items enumerated fails
      - name: API boundary manifest (tests)
        run: python3 scripts/test_api_boundary.py
      - name: API boundary manifest
        run: python3 scripts/api_boundary.py

  no_std:
    name: no_std (rlib, thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml carries the pin and the bare-metal target
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo check` on host is not a no_std proof (std is linked anyway);
      # only a target without std is. rlib crate-type: no panic handler needed.
      - name: Build rlib for a target without std
        run: cargo rustc --lib --no-default-features --crate-type rlib --target thumbv7em-none-eabihf
      - name: Build rlib for a target without std (simd)
        run: cargo rustc --lib --no-default-features --features simd --crate-type rlib --target thumbv7em-none-eabihf

  msrv:
    name: MSRV (rust-version = 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85
        with:
          targets: thumbv7em-none-eabihf
      # the action's `targets:` input has silently not installed the target
      # (first CI run of this repo); the explicit call is idempotent
      - name: Ensure thumbv7em-none-eabihf rust-std is installed for 1.85
        run: rustup target add --toolchain 1.85 thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # `rust-version` is only true if this compiles; bump both together
      - name: cargo check on MSRV (lib, default features)
        run: cargo +1.85 check --lib --locked
      - name: cargo check on MSRV (lib, docs.rs feature set)
        run: cargo +1.85 check --lib --locked --features "$ALL_FEATURES"
      - name: cargo build on MSRV (no_std rlib, bare-metal target)
        run: cargo +1.85 rustc --lib --locked --no-default-features --crate-type rlib --target thumbv7em-none-eabihf

  feature-powerset:
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # 2 features → 4 combinations
      - name: Powerset (all depths)
        run: cargo hack check --lib --feature-powerset

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (default)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --lib --no-deps
      - name: cargo doc (docs.rs feature set)
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --lib --no-deps --features "$ALL_FEATURES"

  docs-lint:
    # run on every OS so a locale or path difference in the checker itself
    # shows up here rather than as a silent pass
    name: Docs lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check
      - name: tracked binaries oracle (検査器自身の試験)
        run: python scripts/test_tracked_binaries.py
      - name: tracked binaries (build した library を commit しない、走査 0 件で fail)
        run: python scripts/tracked_binaries.py
      - name: Concurrency of every branch-push workflow (test, then check)
        run: |
          python scripts/test_workflow_concurrency.py
          python scripts/workflow_concurrency.py
      - name: Licence check (tests)
        run: python scripts/test_license_check.py
      - name: Licence check (Cargo.toml, shipped files, cargo package --list, README)
        run: python scripts/license_check.py
      # G10: no OS entropy or wall clock in src/ (clippy's disallowed-methods
      # in clippy.toml is the compiled first layer; this is the second,
      # compile-free layer, run on every OS)
      - name: Entropy guard (tests)
        run: python scripts/test_entropy_guard.py
      - name: Entropy guard (no OS entropy or wall clock in src/)
        run: python scripts/entropy_guard.py
      # a digest test reads float bits only through tests/support/digest_bits.rs, which refuses
      # a NaN other than the canonical one (0 digest tests found fails)
      - name: Law digest float bits (test, then check)
        run: |
          python scripts/test_law_bits_check.py
          python scripts/law_bits_check.py
      # G1, libm half: a direct libm dependency must come with the libm:: ban
      # in clippy.toml and scripts/libm_ban_check.py (0 manifests read fails)
      - name: libm dependency guard (test, then check)
        run: |
          python scripts/test_libm_dependency_guard.py
          python scripts/libm_dependency_guard.py
      # G14, static half: no fast-math-style flag, target-cpu=native or flag value
      # the guard cannot resolve in any file a flag can come from; the simd-paths
      # native leg and its preflight mirror are the two allow entries in
      # scripts/build_config_allowlist.toml. Nothing read fails
      - name: Build configuration guard (test, then check)
        run: |
          python scripts/test_build_config_guard.py
          python scripts/build_config_guard.py
      # the dynamic half's parser on each OS (the check itself is the build-flags job)
      - name: Effective rustc flags check (tests)
        run: python scripts/test_build_flags_check.py
      # the zero-test guard shared with ALICE-DB / ALICE-Analytics / ALICE-Edge /
      # ALICE-Zip, on each OS's own bash
      - name: run_tests.sh (tests)
        run: python scripts/test_run_tests.py
      # the changes / gate jobs of the path-filtered workflows (fuzz / security-audit / g3-ir / exhaustive-f32): the
      # script's own tests, and each .github/paths/<workflow>.txt equal to its pull_request paths
      - name: Changed paths tests + pattern sync
        run: |
          python scripts/test_changed_paths.py
          python scripts/changed_paths.py sync
          python scripts/test_exhaustive_count.py
      # ALICE-Law G11 (c): the files shared with the other crates are the bytes ALICE-Law's
      # table records (table and checker fetched at .github/shared-files-pin, both SHA-256
      # pinned); a difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        shell: bash
        run: |
          python3 scripts/test_shared_files.py
          scripts/shared_files.sh
      # ALICE-Law G11: every gate declared pass has a row in conformance/g11.toml; the checker
      # (scripts/g11_table_check.py) is fetched at .github/g11-table-pin and SHA-256 pinned; 0 compared fails
      - name: G11 table matches the declared gates
        shell: bash
        run: scripts/g11_table.sh
      # ALICE-Law G11 self-check: the table, its rows, the shared copies and the manifest, from an ALICE-Law
      # checkout at the revision .github/shared-files-pin names (the script refuses another revision)
      - name: G11 self-check (ALICE-Law at the pinned revision)
        shell: bash
        run: |
          rev=$(awk '$1 == "rev" { print $2 }' .github/shared-files-pin)
          # core.autocrlf=false: the Windows runner's git would check the table out with CRLF, and its
          # SHA-256 would not be the pin's
          git -c core.autocrlf=false clone --quiet https://github.com/ext-sakamoro/ALICE-Law "$RUNNER_TEMP/alice-law"
          git -C "$RUNNER_TEMP/alice-law" checkout --quiet --detach "$rev"
          python3 "$RUNNER_TEMP/alice-law/scripts/g11_self_check.py" --repo . --name ALICE-DetMath

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
      # every job has a job-level timeout-minutes (a hung step otherwise holds a shared
      # runner for GitHub's 6-hour limit); the checker's own tests run first
      - name: workflow-timeouts
        run: |
          python3 scripts/test_workflow_timeouts.py
          python3 scripts/workflow_timeouts.py
