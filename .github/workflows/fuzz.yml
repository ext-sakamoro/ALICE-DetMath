name: Fuzz

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/fuzz.txt)
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'fuzz/**'
      - 'rust-toolchain.toml'
      - 'scripts/fuzz_runs.py'
      - 'scripts/test_fuzz_runs.py'
      - 'scripts/changed_paths.py'
      - '.github/workflows/fuzz.yml'
      - '.github/paths/fuzz.txt'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

permissions:
  contents: read

# on main each commit has a group of its own (a group keeps one pending run and
# would cancel an older pending one whatever cancel-in-progress says), and a
# newer push cancels an older run only off main: main and the scheduled run
# finish, so their result is a verdict and not "cancelled"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/fuzz.txt

  fuzz:
    name: Fuzz — ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/main' && 3 || 2 }}
      matrix:
        target:
          - fuzz_simd_parity
          - fuzz_accuracy
          - fuzz_round_exact
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Test the run-count reader
        run: python3 scripts/test_fuzz_runs.py
      # blocking: a fuzz target that does not compile is a red, not a warning
      - name: Build fuzz target
        run: |
          cd fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"
      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"
      - name: Replay committed seeds (blocking)
        run: |
          cd fuzz
          seeds="seeds/${{ matrix.target }}"
          if [ -d "$seeds" ] && [ -n "$(ls -A "$seeds")" ]; then
            for f in "$seeds"/*; do
              echo "replay: $f"
              cargo +nightly fuzz run "${{ matrix.target }}" "$f"
            done
          else
            echo "no committed seeds for ${{ matrix.target }}"
          fi
      # The time-boxed run is a gate: a crash, or a run that executed no
      # input, fails the job (blocking; no continue-on-error). A crash input
      # is uploaded for triage and, once fixed, committed to fuzz/seeds/ so
      # that the blocking replay above keeps it.
      - name: Run fuzz target (time-boxed)
        id: run
        shell: bash
        run: |
          set -o pipefail
          cd fuzz
          mkdir -p "corpus/${{ matrix.target }}"
          dirs=("corpus/${{ matrix.target }}")
          [ -d "seeds/${{ matrix.target }}" ] && dirs+=("seeds/${{ matrix.target }}")
          cargo +nightly fuzz run "${{ matrix.target }}" "${dirs[@]}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
      # crash or 0 runs = red; runs / seconds / result per target in the summary
      - name: Check the runs (crash or 0 runs = fail)
        if: always() && steps.run.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "| target | runs | seconds | result |"
            echo "|---|---|---|---|"
            python3 scripts/fuzz_runs.py "${{ matrix.target }}" "$RUNNER_TEMP/fuzz.log"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload crash artifacts (if any)
        if: failure() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Report crash
        if: failure() && steps.run.outcome == 'failure'
        run: echo "::error::fuzz target ${{ matrix.target }} found a crash — see fuzz-crash-${{ matrix.target }} artifact"

  # red when the changes job said run and a heavy job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
