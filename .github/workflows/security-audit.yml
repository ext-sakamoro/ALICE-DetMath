name: Security & Hygiene

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - 'fuzz/Cargo.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - 'fuzz/Cargo.toml'
      - '.github/workflows/security-audit.yml'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  audit:
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit --deny yanked

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo deny (all features)
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: bnjbvr/cargo-machete@main

  stub-guard:
    name: Stub / mock / dbg / libm guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect todo! / unimplemented! / panic!(STUB)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'todo!\(|unimplemented!\(|panic!\([^)]*STUB' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ Stub / unimplemented / STUB panic detected (production path):"
            echo "$hits"
            exit 1
          fi
          echo "✓ No todo! / unimplemented! / panic!(STUB) in src/"
      - name: Detect dbg!() residual
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in production code:"
            echo "$hits"
            exit 1
          fi
          echo "✓ No dbg!()"
      # The crate's own promise: no platform libm call and no fma anywhere in
      # src/ (the `ops` module is the only place allowed to call `.sqrt()`,
      # behind the `std` feature). floor / ceil / trunc / round / sqrt are
      # exact IEEE operations (any correct implementation returns the same
      # bits), so they are not libm in this sense; whether they exist without
      # std is what the thumbv7em no_std build checks. Test modules are
      # excluded (they call libm as the reference on purpose).
      - name: Detect platform libm / mul_add calls in src/
        run: |
          set -eo pipefail
          hits=$(grep -rnE '\.(sin|cos|tan|asin|acos|atan|atan2|sinh|cosh|tanh|exp|exp2|ln|log|log2|log10|powf|powi|cbrt|hypot|mul_add)\(' src/ --include="*.rs" \
            | grep -vE '^\S+:\s*//' \
            | grep -vE 'src/ops\.rs:[0-9]+:\s+x\.sqrt\(\)' \
            | grep -vE 'tests|assert|x\.round\(\)|y\.round\(\)|x\.sqrt\(\)|y\.sqrt\(\)|f64::|f32::' \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ platform libm / mul_add call in src/ (breaks the bit-exact guarantee):"
            echo "$hits"
            exit 1
          fi
          echo "✓ No platform libm / mul_add in src/ (outside ops::sqrt std path and test modules)"

  package-integrity:
    name: Package integrity (publish される .crate が build できるか)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      # (2026-09-28 ALICE-LOL の lol.gbnf で発生)
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      - name: cargo package (.crate を作る)
        # --no-verify: 未 publish の sibling に path dep がある repo では verify step が
        #   registry 解決で落ちる 展開後の隔離 build が本体なので verify は不要
        run: cargo package --no-verify --allow-dirty

      - name: 展開して隔離 build
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' | head -1)
          [ -n "$crate" ] || { echo "::error::.crate が生成されていない"; exit 1; }
          echo "packaged: $(basename "$crate") ($(du -h "$crate" | cut -f1))"
          tmp=$(mktemp -d)
          tar xzf "$crate" -C "$tmp"
          cd "$tmp"/*/
          # 親 workspace を継承すると member 扱いになり、境界を越えた file が
          # 再び見えてしまう (検査の意味が消える) ので単独 package として build
          printf '\n[workspace]\n' >> Cargo.toml
          cargo check --all-features

  coverage:
    name: Coverage (cargo-llvm-cov, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage (docs.rs feature set)
        run: |
          set -o pipefail
          cargo llvm-cov --features std,simd --summary-only 2>&1 | tee coverage-summary.txt
      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  semver-checks:
    name: cargo-semver-checks (API compat vs crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Before the first crates.io release there is no baseline; skip with a
      # notice instead of a red (job-level continue-on-error would also hide
      # real breakage, canonical trap #22)
      - name: Check for a published baseline
        id: baseline
        run: |
          if cargo search alice-det-math --limit 1 | grep -q '^alice-det-math = '; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::alice-det-math is not on crates.io yet; semver-checks skipped"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.published == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0
      - name: Run cargo semver-checks (docs.rs feature set)
        if: steps.baseline.outputs.published == 'true'
        run: >
          cargo semver-checks check-release --package alice-det-math
          --only-explicit-features --features std,simd
      # The run above selects its lints by the bump already declared, so once
      # Cargo.toml is a major (or 0.x minor) ahead of crates.io it decides that
      # every lint is unnecessary and compares nothing -- while still printing
      # "no semver update required" and exiting 0. Measured on 0.4.0:
      # "0 checks: 0 pass, 254 skip". Asking for a patch release makes it run
      # the major and minor lints, and the gate is the number of comparisons,
      # not the exit code: exit 100 is the normal outcome of a release that is
      # genuinely breaking and means "here is the list", not "failed".
      - name: Run cargo semver-checks as a patch release (the gate is the count)
        if: steps.baseline.outputs.published == 'true'
        run: |
          set -uo pipefail
          out=$(cargo semver-checks check-release --package alice-det-math \
                --only-explicit-features --features std,simd \
                --release-type patch 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          printf '%s\n' "$out"
          n=$(printf '%s\n' "$out" | grep -oE '[0-9]+ checks: ' | grep -oE '[0-9]+' | tail -1)
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then
            echo "::error::semver-checks compared nothing (${n:-no count found}); the gate is vacuous"
            exit 1
          fi
          echo "semver-checks compared $n lints"
