# Test targets and tests that do not run on wasm32-wasip1, each with its reason (scripts/wasm_tests_check.py).
# A target or a should_panic test missing from here and not run on wasm fails the check; an entry that
# names nothing the run skipped fails too.

# whole test targets not run on wasm (none: every target runs)
[targets]

# libtest skips a #[should_panic] test where a panic aborts the process (wasm32-wasip1); these assert
# a panic by design and run on the native lanes
[should_panic]
"dense_golden::the_pin_refuses_a_non_canonical_f32_output" = "checks that the pin helper panics on a leaked NaN; panic=abort on wasm, and the refusal it relies on runs on wasm in law_bits::the_api_refuses_*"
